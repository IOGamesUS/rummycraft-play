		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

/* Phones (spec: /tech/web-build.md, the page shell; 2026-11-03): the page never scrolls or zooms
   and covers the whole screen (viewport-fit=cover, so a rotation cannot leave it inset or offset),
   and the script below fits the canvas to the safe area (inside an iPhone's notch and home bar),
   measured by the two probes, so the game stays centered and every button can be reached. */
html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
}

body {
	color: white;
	background-color: black;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	position: fixed;
	left: 0;
	top: 0;
	width: 100vw;
	height: 100vh;
	touch-action: none;
}

#screen-probe, #safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
}

#screen-probe {
	inset: 0;
}

#safe-probe {
	top: env(safe-area-inset-top, 0px);
	right: env(safe-area-inset-right, 0px);
	bottom: env(safe-area-inset-bottom, 0px);
	left: env(safe-area-inset-left, 0px);
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<div id="screen-probe"></div>
		<div id="safe-probe"></div>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":10109372,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// The canvas fits the screen's safe area (the export's canvas resize policy is None, so Godot takes
// the canvas size set here). Godot's own "Adaptive" fit read window.innerWidth/innerHeight, which on
// an iPhone home-screen app can keep the old size or an offset after a rotation, and ignored the
// notch and home bar: the game showed off center with its bottom row out of reach (2026-11-03).
(function () {
	const canvas = document.getElementById('canvas');
	const screenProbe = document.getElementById('screen-probe');
	const safeProbe = document.getElementById('safe-probe');
	function area() {
		const vv = window.visualViewport;
		if (vv && Math.abs(vv.scale - 1) > 0.01) {
			// Zoomed in (it should not happen, see gesturestart): fill what shows.
			return [vv.offsetLeft, vv.offsetTop, vv.width, vv.height];
		}
		const s = safeProbe.getBoundingClientRect();
		const full = screenProbe.getBoundingClientRect();
		if (s.width > 50 && s.height > 50) {
			return [s.left, s.top, s.width, s.height];
		}
		return [full.left, full.top, full.width || window.innerWidth, full.height || window.innerHeight];
	}
	function fit() {
		if (window.scrollX !== 0 || window.scrollY !== 0) {
			window.scrollTo(0, 0);
		}
		if (document.fullscreenElement) {
			canvas.style.left = '0px';
			canvas.style.top = '0px';
			canvas.style.width = '';
			canvas.style.height = '';
		} else {
			const [x, y, w, h] = area();
			canvas.style.left = `${Math.round(x)}px`;
			canvas.style.top = `${Math.round(y)}px`;
			canvas.style.width = `${Math.round(w)}px`;
			canvas.style.height = `${Math.round(h)}px`;
		}
		const rect = canvas.getBoundingClientRect();
		const dpr = window.devicePixelRatio || 1;
		const pw = Math.max(1, Math.round(rect.width * dpr));
		const ph = Math.max(1, Math.round(rect.height * dpr));
		if (canvas.width !== pw || canvas.height !== ph) {
			canvas.width = pw;
			canvas.height = ph;
		}
	}
	function later() {
		fit();
		// iPhones report the new size a beat after a rotation (and a home-screen app sometimes later).
		[100, 300, 700, 1500].forEach((ms) => setTimeout(fit, ms));
	}
	window.addEventListener('resize', later);
	window.addEventListener('orientationchange', later);
	if (screen.orientation) {
		screen.orientation.addEventListener('change', later);
	}
	window.addEventListener('pageshow', later);
	document.addEventListener('visibilitychange', later);
	window.addEventListener('scroll', fit, { passive: true });
	document.addEventListener('fullscreenchange', later);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', later);
		window.visualViewport.addEventListener('scroll', fit);
	}
	// Safari ignores user-scalable=no: stop pinch and double-tap zoom on the page.
	document.addEventListener('gesturestart', (e) => e.preventDefault());
	document.addEventListener('dblclick', (e) => e.preventDefault());
	setInterval(fit, 1000);
	window.rummycraftFit = fit;
	fit();
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
